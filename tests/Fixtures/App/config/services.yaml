framework:
  test: true
  secret: test

monolog:
  channels: [audit]
  handlers:
    test:
      type: test
      level: debug

wexample_symfony_security:
  redaction:
    query_parameters: [sig]
    patterns: ['/(?<=Bearer )\S+/']
  rate_limits:
    - { name: fixture_writes, methods: [post], limit: 2, interval: '1 minute' }
    - { name: fixture_mail, paths: '#^/open/mail$#', limit: 1, interval: '1 minute' }
  headers:
    frame_options: DENY
    referrer_policy: ~

services:
  _defaults:
    autowire: true
    autoconfigure: true

  Wexample\SymfonySecurity\Tests\Fixtures\App\Log\:
    resource: '../Log/'

  Wexample\SymfonySecurity\Tests\Fixtures\App\Controller\:
    resource: '../Controller/'
    tags: ['controller.service_arguments']
