framework:
  test: true
  secret: test

monolog:
  channels: [audit]
  handlers:
    test:
      type: test
      level: debug

wexample_symfony_security:
  redaction:
    query_parameters: [sig]
    patterns: ['/(?<=Bearer )\S+/']
  headers:
    frame_options: DENY
    referrer_policy: ~

services:
  _defaults:
    autowire: true
    autoconfigure: true

  Wexample\SymfonySecurity\Tests\Fixtures\App\Log\:
    resource: '../Log/'
