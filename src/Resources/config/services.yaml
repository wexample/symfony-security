services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Wexample\SymfonySecurity\Log\SecretRedactionProcessor:
        tags:
            # Last of the logger's processors: what the others add is walked too.
            - { name: monolog.processor, priority: -1024 }

    Wexample\SymfonySecurity\EventSubscriber\RateLimitSubscriber:
        arguments:
            $cache: '@cache.app'

    Wexample\SymfonySecurity\Service\ProofOfWorkService:
        arguments:
            # Shared by every worker: a challenge solved on one is spent on all.
            $cache: '@cache.app'
            $secret: '%kernel.secret%'
            $maxNumber: '%wexample_symfony_security.proof_of_work.max_number%'
            $lifetime: '%wexample_symfony_security.proof_of_work.lifetime%'
            $minDelay: '%wexample_symfony_security.proof_of_work.min_delay%'
